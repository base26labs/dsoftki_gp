[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsoftki"
version = "0.1.0"
description = "Scaling Gaussian Process Regression with Full Derivative Observations"
authors = [{ name = "The DSoftKI Authors", email = "dan@base26labs.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "licenses/*.txt"]

dependencies = [
    "torch>=2.4.1",
    "scipy>=1.14.1",
    "scikit-learn>=1.5.2",
    "pandas>=2.2.3",
    "matplotlib>=3.9.2",
    "omegaconf>=2.3.0",
    "gpytorch==1.12",
    "botorch==0.11.3",
    "seaborn>=0.13.2",
    "tqdm==4.66.5",
    "requests==2.32.3",
    "hydra-core",
    "wandb",
]

[tool.setuptools]
packages = ["data", "gp", "linear_solver"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.sh"]
